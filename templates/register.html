<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Finance Tracker</title>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 20px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8f8f8;
            color: #242424;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .signup-card {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border: 1px solid #dedede;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 8px 28px rgb(0 0 0 / 3%);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .brand-mark {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 46px;
            height: 46px;
            padding: 12px;
            border-radius: 12px;
            background: #eeeeee;
        }

        .brand-mark span {
            width: 6px;
            border-radius: 2px;
            background: #292929;
        }

        .brand-mark span:nth-child(1) {
            height: 9px;
        }

        .brand-mark span:nth-child(2) {
            height: 16px;
        }

        .brand-mark span:nth-child(3) {
            height: 23px;
        }

        .brand-name {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 26px;
            line-height: 1.25;
            letter-spacing: -0.6px;
        }

        .intro {
            margin: 10px 0 26px;
            color: #666666;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .field-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            display: block;
            width: 100%;
            height: 44px;
            padding: 0 42px 0 38px;
            border: 1px solid #e6e6e6;
            border-radius: 9px;
            background: #f3f3f3;
            color: #242424;
            font-family: inherit;
            font-size: 14px;
        }

        .input-wrap input::placeholder {
            color: #777777;
            opacity: 1;
        }

        .input-wrap input:focus {
            outline: 2px solid #777777;
            outline-offset: 2px;
        }

        .input-wrap input:-webkit-autofill {
            -webkit-text-fill-color: #242424;
            -webkit-box-shadow: 0 0 0 1000px #f3f3f3 inset;
        }

        .field-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            width: 17px;
            height: 17px;
            transform: translateY(-50%);
            color: #6a6a6a;
            pointer-events: none;
        }

        .icon {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .password-toggle {
            position: absolute;
            top: 2px;
            right: 2px;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #666666;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: #222222;
            background: #e8e8e8;
        }

        .password-toggle:focus-visible {
            outline: 2px solid #666666;
            outline-offset: -3px;
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
        }

        /* The button's state controls the slash directly through CSS. */
        .password-toggle .eye-slash {
            opacity: 0;
        }

        .password-toggle[data-visible="true"] .eye-slash {
            opacity: 1;
        }

        .hint {
            display: block;
            margin-top: 7px;
            font-size: 11px;
            line-height: 1.5;
            color: #666666;
        }

        .submit-button {
            display: block;
            width: 100%;
            height: 44px;
            margin-top: 24px;
            border: 1px solid #222222;
            border-radius: 9px;
            background: #262626;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #3b3b3b;
        }

        .submit-button:focus-visible {
            outline: 2px solid #666666;
            outline-offset: 3px;
        }

        .message {
            margin: 0 0 18px;
            padding: 12px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            background: #f5f5f5;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 420px) {
            body {
                padding: 20px 12px;
            }

            .signup-card {
                padding: 24px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="signup-card">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p class="brand-name">Finance Tracker</p>
        </div>

        <h1>Create an account</h1>
        <p class="intro">
            Track your expenses and understand where your money goes.
        </p>

        {% if success %}
            <p class="message" role="status">{{ success }}</p>
        {% endif %}

        {% if error %}
            <p class="message" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="field-group">
                <label for="email">Email</label>

                <div class="input-wrap">
                    <svg class="field-icon icon" viewBox="0 0 24 24"
                         aria-hidden="true" focusable="false">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m3 6 9 7 9-7"></path>
                    </svg>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="254"
                        value="{{ request.form.get('email', '') }}"
                        required
                    >
                </div>
            </div>

            <div class="field-group">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <svg class="field-icon icon" viewBox="0 0 24 24"
                         aria-hidden="true" focusable="false">
                        <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                        <path d="M12 14v3"></path>
                    </svg>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="15"
                        maxlength="128"
                        aria-describedby="password-hint"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                        data-label="password"
                        data-visible="false"
                        aria-label="Show password"
                        aria-controls="password"
                        title="Show password"
                        hidden
                    >
                        <svg class="icon" viewBox="0 0 24 24"
                             aria-hidden="true" focusable="false">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <path class="eye-slash" d="M3 3 21 21"></path>
                        </svg>
                    </button>
                </div>

                <small class="hint" id="password-hint">
                    Use at least 15 characters, including a number and a symbol.
                </small>
            </div>

            <div class="field-group">
                <label for="confirm_password">Confirm password</label>

                <div class="input-wrap">
                    <svg class="field-icon icon" viewBox="0 0 24 24"
                         aria-hidden="true" focusable="false">
                        <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                        <path d="M12 14v3"></path>
                    </svg>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="15"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirm_password"
                        data-label="confirmation password"
                        data-visible="false"
                        aria-label="Show confirmation password"
                        aria-controls="confirm_password"
                        title="Show confirmation password"
                        hidden
                    >
                        <svg class="icon" viewBox="0 0 24 24"
                             aria-hidden="true" focusable="false">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <path class="eye-slash" d="M3 3 21 21"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-button">
                Create account
            </button>
        </form>
    </main>

    <script>
        document.querySelectorAll(".password-toggle").forEach((button) => {
            const input = document.getElementById(button.dataset.target);

            input.type = "password";
            button.dataset.visible = "false";

            button.addEventListener("click", () => {
                const showPassword = input.type === "password";

                input.type = showPassword ? "text" : "password";
                button.dataset.visible = String(showPassword);

                const action = showPassword ? "Hide" : "Show";
                const label = `${action} ${button.dataset.label}`;

                button.setAttribute("aria-label", label);
                button.title = label;
            });

            button.removeAttribute("hidden");
        });
    </script>
</body>
</html>
